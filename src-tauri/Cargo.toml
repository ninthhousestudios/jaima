[package]
name = "jaima"
version = "0.1.0"
description = "A digital temple for Amma"
authors = ["josh"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
# Serves the embedded site over http://localhost instead of tauri://localhost.
# Not a preference: YouTube rejects embeds whose requests carry no Referer
# (error 153), and the webviews send none for non-http(s) schemes — so the
# arati player only works from a real http origin. The port is fixed because
# the window URL lives declaratively in tauri.conf.json.
tauri-plugin-localhost = "2"
